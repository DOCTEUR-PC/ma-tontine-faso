databases:
  - name: tontine-db
    plan: free
    databaseName: tontine
    user: tontine_user

services:
  - type: web
    name: tontine-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tontine-db
          property: connectionURI
      - key: CORS_ORIGINS
        value: https://matontine.docteurpc.org
